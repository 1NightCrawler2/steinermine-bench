<meta charset="utf-8">
<title>SteinerMineBench — xgrid-fcj-qpoor</title>
<style>
:root{
  --bg:#16180f; --panel:#20241a; --line:#3a4030; --ink:#e8eade;
  --ink2:#a8ae9c; --ink3:#6f7663;
  --ok:#8fc476; --bad:#e2726f; --ramp:#f2d97a; --xcut:#6fb8bb; --accent:#f2d97a;
  --stage0:#101208; --stage1:#292d1e;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f4f4ee; --panel:#fff; --line:#dcdccf; --ink:#1e2119;
         --ink2:#5a6050; --ink3:#8d9380; --ramp:#8a6d1f; --xcut:#2f6f72;
         --stage0:#e4e5da; --stage1:#fbfbf6; }
}
:root[data-theme="dark"]{ --bg:#16180f; --panel:#20241a; --line:#3a4030;
  --ink:#eef0e4; --ink2:#b4baa6; --ink3:#7d856e; --ramp:#f2d97a; --xcut:#6fb8bb;
  --stage0:#101208; --stage1:#292d1e;}
:root[data-theme="light"]{ --bg:#f4f4ee; --panel:#fff; --line:#dcdccf;
  --ink:#1e2119; --ink2:#5a6050; --ink3:#8d9380; --ramp:#8a6d1f; --xcut:#2f6f72;
  --stage0:#e4e5da; --stage1:#fbfbf6;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
h1{margin:0;font-size:15px;letter-spacing:.02em;font-weight:600}
.sub{color:var(--ink3);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 330px;
  gap:0;height:calc(100vh - 52px)}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}}
/* The stage is lifted off the page ground and vignetted, so the point cloud
   sits on a surface instead of floating in a void; a flat near-black field
   gives the faintest points nothing to read against. */
#stage{position:relative;min-height:420px;background:
  radial-gradient(ellipse 80% 80% at 50% 45%,var(--stage1),var(--stage0))}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
aside{border-left:1px solid var(--line);background:var(--panel);
  overflow-y:auto;padding:14px 16px}
@media (max-width:900px){aside{border-left:0;border-top:1px solid var(--line)}}
select{width:100%;padding:7px 9px;background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:5px;font:inherit;font-size:13px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;
  font-weight:600;letter-spacing:.03em}
.pill.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:12px 0}
dt{color:var(--ink3);font-size:12px}
dd{margin:0;font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink3);margin:18px 0 6px;font-weight:600}
ul{margin:0;padding-left:16px;font-size:12px;color:var(--ink2)}
li{margin:3px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);
  padding:8px 18px;border-top:1px solid var(--line)}
.sw{display:inline-block;width:16px;height:3px;vertical-align:middle;
  margin-right:5px;border-radius:2px}
.hint{position:absolute;left:14px;bottom:14px;font-size:11px;color:var(--ink3);
  pointer-events:none;max-width:45%}
#ctl{position:absolute;left:12px;top:12px;display:flex;gap:10px;align-items:center;
  background:color-mix(in srgb,var(--panel) 88%,transparent);
  border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12px;
  color:var(--ink2);backdrop-filter:blur(6px);flex-wrap:wrap;max-width:calc(100% - 24px)}
#ctl label{display:flex;gap:5px;align-items:center}
#ctl select{width:auto;padding:3px 6px;font-size:12px}
#ctl input[type=range]{width:150px;accent-color:var(--accent)}
.mono{font-variant-numeric:tabular-nums;color:var(--ink);min-width:74px}
#ramp{position:absolute;right:12px;bottom:12px;font-size:10.5px;color:var(--ink2);
  text-align:right;pointer-events:none;line-height:1.6;
  background:color-mix(in srgb,var(--panel) 88%,transparent);
  border:1px solid var(--line);border-radius:7px;padding:8px 10px;
  backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:2px}
#ramp .bar{height:9px;width:150px;border-radius:2px;
  border:1px solid var(--line);align-self:flex-end}
.vio{border-left:2px solid var(--bad);padding-left:8px;margin:6px 0;
  font-size:11.5px;color:var(--ink2)}
.vio b{color:var(--bad);font-weight:600}
</style>

const CQ = CLOUD ? b64bytes(CLOUD.q) : null;
const COST = VOL ? b64bytes(VOL.cost) : null;
const FAULT = (VOL && VOL.fault) ? b64bytes(VOL.fault) : null;
// Row-major (x, y, z) exactly as numpy wrote it.
const vAt = (a,ix,iy,iz) => a[(ix*VOL.dims[1] + iy)*VOL.dims[2] + iz];

// Sequential ramp, one hue, running AWAY from the page background: on a light
// ground cheap rock is pale and expensive rock deep; on a dark ground that is
// inverted, because a 26 %-lightness swatch on a near-black page is invisible
// and the expensive rock -- the thing worth seeing -- disappears exactly where
// it matters.  Faults keep their own hue so they read as a different KIND of
// thing, not as more of the same cost.
function isDark(){
  const bg = getComputedStyle(document.body).backgroundColor || '';
  const m = bg.match(/\d+/g);
  if(!m) return true;
  return (0.299*m[0] + 0.587*m[1] + 0.114*m[2]) < 128;
}
function costColor(q, alpha){
  const t = (q - 1) / 253;
  if(isDark()){
    // dim cool for cheap ground, bright warm for expensive
    const l = 34 + 52 * t, c = 8 + 46 * t, h = 96 - 56 * t;
    return `lch(${l}% ${c} ${h} / ${alpha})`;
  }
  const l = 90 - 64 * t, c = 10 + 34 * t, h = 84 - 46 * t;
  return `lch(${l}% ${c} ${h} / ${alpha})`;
}
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const pick = document.getElementById('pick'), info = document.getElementById('info');
let cur = 0, yaw = -0.6, pitch = 0.5, zoom = 0.62, panx = 0, pany = 0;

DATA.forEach((d,i)=>{
  const o = document.createElement('option');
  o.value = i;
  o.textContent = (d.infeasible ? '✗ ' : '✓ ') + d.name;
  pick.appendChild(o);
});
pick.onchange = () => { cur = +pick.value; describe(); draw(); };

// One shared world frame so switching candidates does not move the camera.
const all = [];
DATA.forEach(d => d.segments.forEach(s => s.pts.forEach(p => all.push(p))));
const lo = [0,1,2].map(k => Math.min(...all.map(p=>p[k])));
const hi = [0,1,2].map(k => Math.max(...all.map(p=>p[k])));
const mid = [0,1,2].map(k => (lo[k]+hi[k])/2);
const span = Math.max(...[0,1,2].map(k => hi[k]-lo[k])) || 1;

function project(p, w, h){
  let x = p[0]-mid[0], y = p[1]-mid[1], z = p[2]-mid[2];
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  [x, y] = [x*cy - y*sy, x*sy + y*cy];
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const yy = y*cp - z*sp, depth = y*sp + z*cp;
  const s = Math.min(w,h) * 0.78 * zoom / span;
  return [w/2 + x*s + panx, h/2 - yy*s + pany, depth];
}

function drawSlice(w, h){
  if(!VOL || !COST) return;
  const ax = +document.getElementById('axis').value;
  if(ax < 0) return;
  const [nx,ny,nz] = VOL.dims, cell = VOL.cell, o = VOL.origin;
  const n = VOL.dims[ax];
  const i = Math.min(n-1, Math.max(0, +document.getElementById('slice').value));
  const showF = FAULT && document.getElementById('faults').checked;

  // The two in-plane axes.
  const au = ax === 0 ? 1 : 0, av = ax === 2 ? 1 : 2;
  const nu = VOL.dims[au], nv = VOL.dims[av];
  const corner = (iu, iv) => {
    const c = [0,0,0];
    c[ax] = o[ax] + i*cell;
    c[au] = o[au] + iu*cell;
    c[av] = o[av] + iv*cell;
    return c;
  };
  // Project the lattice of corners once, then fill cells from it.
  const P = [];
  for(let iu=0; iu<=nu; iu++){
    const row = [];
    for(let iv=0; iv<=nv; iv++) row.push(project(corner(iu,iv), w, h));
    P.push(row);
  }
  for(let iu=0; iu<nu; iu++){
    for(let iv=0; iv<nv; iv++){
      const idx = [0,0,0]; idx[ax]=i; idx[au]=iu; idx[av]=iv;
      const q = vAt(COST, idx[0], idx[1], idx[2]);
      if(!q) continue;                       // air / unmapped: leave the void
      const faulted = showF && vAt(FAULT, idx[0], idx[1], idx[2]);
      ctx.fillStyle = faulted ? 'lch(58% 52 24 / 0.88)' : costColor(q, 0.86);
      const a=P[iu][iv], b=P[iu+1][iv], c=P[iu+1][iv+1], e=P[iu][iv+1];
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]);
      ctx.lineTo(c[0],c[1]); ctx.lineTo(e[0],e[1]); ctx.closePath(); ctx.fill();
    }
  }
  const axname = ['E','N','RL'][ax];
  document.getElementById('slicelbl').textContent =
    axname + ' ' + Math.round(o[ax] + i*cell) + ' m';
}

function drawCloud(w, h){
  if(!CLOUD || !CQ) return;
  // Painter's order: the cloud is context, so it goes down first and stays
  // faint -- it must never compete with the alignment for attention.
  const pts = CLOUD.xyz;
  const order = [];
  for(let i=0;i<pts.length;i++){
    const q = project(pts[i], w, h);
    order.push([q[2], q[0], q[1], CQ[i]]);
  }
  order.sort((a,b)=>a[0]-b[0]);
  // Opacity and size both rise with cost, so the expensive ground reads first.
  // The floor matters as much as the range: below ~0.3 alpha at 1 px the cloud
  // is grey dust on any ground, and a uniform-cost model is then invisible in
  // its entirety.
  for(const [,x,y,q] of order){
    const t = (q-1)/253;
    const a = 0.38 + 0.50*t, r = 1.5 + 0.9*t;
    ctx.fillStyle = costColor(q, a);
    ctx.fillRect(x-r, y-r, 2*r, 2*r);
  }
}

function drawTerminals(w, h){
  if(!TERMS || !document.getElementById('terms').checked) return;
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--ink').trim();
  for(const t of TERMS){
    ctx.fillStyle = t.portal ? 'lch(72% 60 145 / 0.85)' : 'lch(62% 52 300 / 0.55)';
    for(const p of t.pts){
      const q = project(p, w, h);
      ctx.fillRect(q[0]-1.6, q[1]-1.6, 3.2, 3.2);
    }
    // One label per group, at its centroid, so the scene stays readable.
    const c = [0,1,2].map(k => t.pts.reduce((a,p)=>a+p[k],0)/t.pts.length);
    const q = project(c, w, h);
    ctx.fillStyle = ink;
    ctx.font = '600 10.5px ui-sans-serif,system-ui,sans-serif';
    ctx.fillText(t.label, q[0]+6, q[1]-5);
  }
}

  cv.width = w*dpr; cv.height = h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const css = getComputedStyle(document.documentElement);
  const d = DATA[cur];
  const mode = document.getElementById('mode').value;
  if(mode === 'cloud') drawCloud(w, h);
  else if(mode === 'section') drawSlice(w, h);
  drawTerminals(w, h);

  // Ground-plane grid at the model floor, for depth reference.
  ctx.strokeStyle = css.getPropertyValue('--line').trim();
  ctx.lineWidth = 1;
  const N = 6;
  for(let i=0;i<=N;i++){
    const fx = lo[0] + (hi[0]-lo[0])*i/N, fy = lo[1] + (hi[1]-lo[1])*i/N;
    let a = project([fx, lo[1], lo[2]], w, h), b = project([fx, hi[1], lo[2]], w, h);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    a = project([lo[0], fy, lo[2]], w, h); b = project([hi[0], fy, lo[2]], w, h);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }

  // Segments, painted far-to-near so nearer drives read in front.
  const ramp = css.getPropertyValue('--ramp').trim();
  const xcut = css.getPropertyValue('--xcut').trim();
  const segs = d.segments.map(s=>{
    const pr = s.pts.map(p=>project(p,w,h));
    const dep = pr.reduce((a,q)=>a+q[2],0)/Math.max(pr.length,1);
    return {pr, dep, ramp:s.ramp};
  }).sort((a,b)=>a.dep-b.dep);
  for(const s of segs){
    ctx.strokeStyle = s.ramp ? ramp : xcut;
    ctx.lineWidth = s.ramp ? 3.0 : 1.9;
    ctx.lineJoin = ctx.lineCap = 'round';
    ctx.beginPath();
    s.pr.forEach((q,i)=> i ? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1]));
    ctx.stroke();
  }

  // Violations last, so nothing hides them.
  ctx.fillStyle = css.getPropertyValue('--bad').trim();
  for(const v of d.violations){
    const q = project(v.at, w, h);
    ctx.beginPath(); ctx.arc(q[0], q[1], 3.6, 0, 6.284); ctx.fill();
  }
  document.getElementById('scale').textContent =
    'model ' + Math.round(hi[0]-lo[0]) + ' × ' + Math.round(hi[1]-lo[1]) +
    ' × ' + Math.round(hi[2]-lo[2]) + ' m';
}

const money = v => v==null ? '—'
  : '$' + Math.round(v).toLocaleString('en-US');

function describe(){
  const d = DATA[cur];
  const ok = !d.infeasible;
  const why = ok ? 'BUILDABLE — planned and verified'
    : (d.planned === false ? 'INFEASIBLE — the constrained search could not plan every leg'
                           : 'INFEASIBLE — planned, but fails verification');
  let h = '<p style="margin:12px 0 0">' +
    '<span class="pill ' + (ok?'ok':'bad') + '">' + why + '</span></p>';
  if(!ok) h += '<p style="font-size:11.5px;color:var(--ink3);margin:8px 0 0">' +
    'Costs below are what a grade-blind objective would have quoted for a ' +
    'network nobody has shown can be built. Kept as evidence, never ranked.</p>';
  h += '<dl>' +
    '<dt>' + (ok ? 'Buildable capex' : 'Estimate') + '</dt><dd>' + money(d.cost_buildable) + '</dd>' +
    '<dt>Total (capex+opex)</dt><dd>' + money(d.cost_total) + '</dd>' +
    '<dt>Raw voxel cost</dt><dd>' + money(d.cost_raw) + '</dd>' +
    '<dt>Legs planned</dt><dd>' + (d.n_lattice??'—') + ' / ' +
      ((d.n_lattice??0)+(d.n_fallback??0)) + '</dd>';
  const st = d.stats||{};
  if(st.worst_grade!=null) h += '<dt>Worst grade</dt><dd>' +
    (st.worst_grade*100).toFixed(1) + '%</dd>';
  if(st.worst_turn_radius_m!=null) h += '<dt>Min radius</dt><dd>' +
    st.worst_turn_radius_m + ' m</dd>';
  if(st.total_length_m!=null) h += '<dt>Total length</dt><dd>' +
    Math.round(st.total_length_m).toLocaleString('en-US') + ' m</dd>';
  h += '</dl>';

  if(d.infeasible_legs.length){
    h += '<h2>Legs the search could not plan</h2><ul>' +
      d.infeasible_legs.map(x=>'<li>'+x+'</li>').join('') + '</ul>';
  }
  const bc = Object.entries(d.by_check||{});
  if(bc.length){
    h += '<h2>Verifier findings</h2><ul>' +
      bc.sort().map(([k,n])=>'<li><b style="color:var(--bad)">'+k+'</b> × '+n+'</li>').join('') +
      '</ul>';
    const seen = new Set();
    const uniq = d.violations.filter(v=>{
      const k = v.check+'|'+v.detail; if(seen.has(k)) return false;
      seen.add(k); return true; }).slice(0,6);
    h += uniq.map(v=>'<div class="vio"><b>'+v.check+'</b> — '+v.detail+
      '<br><span style="color:var(--ink3)">E'+v.at[0]+' N'+v.at[1]+' RL'+v.at[2]+
      '</span></div>').join('');
  } else if(ok){
    h += '<h2>Verifier findings</h2><p style="font-size:12px;color:var(--ink2);margin:4px 0">' +
      'None. Grade, turn radius, swept passability, continuity and pillar ' +
      'separation all hold on the stored centrelines.</p>';
  }
  h += '<h2>Geometry source</h2><p style="font-size:11.5px;color:var(--ink3);margin:4px 0">' +
    d.source + (d.method ? ' · ' + d.method : '') + '</p>';
  if(d.n_xcut_raw) h += '<p style="font-size:11.5px;color:var(--ink3);margin:6px 0">' +
    d.n_xcut_raw + ' crosscut(s) drawn from the raw voxel path. The buildable ' +
    'stage never smooths crosscuts, so they are shown for completeness but are ' +
    'NOT part of the verified geometry above.</p>';
  info.innerHTML = h;
}

let drag = null;
cv.addEventListener('pointerdown', e=>{
  drag = {x:e.clientX, y:e.clientY, sh:e.shiftKey};
  cv.setPointerCapture(e.pointerId); cv.classList.add('drag');
});
cv.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  if(drag.sh){ panx += dx; pany += dy; }
  else { yaw += dx*0.008; pitch = Math.max(-1.5, Math.min(1.5, pitch + dy*0.008)); }
  drag.x = e.clientX; drag.y = e.clientY; draw();
});
const stop = e=>{ drag=null; cv.classList.remove('drag'); };
cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  zoom = Math.max(0.15, Math.min(14, zoom * (e.deltaY<0 ? 1.12 : 0.89)));
  draw();
}, {passive:false});
addEventListener('resize', draw);
new MutationObserver(draw).observe(document.documentElement,
  {attributes:true, attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
// ── section-plane controls ──────────────────────────────────────────────────
const axSel = document.getElementById('axis');
const slider = document.getElementById('slice');
function syncSlider(){
  const ax = +axSel.value;
  slider.disabled = ax < 0;
  if(ax >= 0 && VOL){
    slider.max = VOL.dims[ax] - 1;
    if(+slider.value > +slider.max) slider.value = Math.floor(VOL.dims[ax]/2);
  }
  if(ax < 0) document.getElementById('slicelbl').textContent = '';
}
axSel.onchange = ()=>{ syncSlider(); draw(); };
slider.oninput = draw;
document.getElementById('faults').onchange = draw;
document.getElementById('terms').onchange = draw;
const modeSel = document.getElementById('mode');
function syncMode(){
  const sec = modeSel.value === 'section';
  document.getElementById('secgrp').style.display = sec ? '' : 'none';
  document.getElementById('faultwrap').style.display =
    (sec && FAULT) ? '' : 'none';
  document.getElementById('ramp').style.display =
    modeSel.value === 'none' ? 'none' : '';
}
modeSel.onchange = ()=>{ syncMode(); draw(); };
if(!CLOUD){ modeSel.querySelector('[value=cloud]').disabled = true;
            modeSel.value = VOL ? 'section' : 'none'; }
if(!VOL && !CLOUD){ document.getElementById('ctl').style.display = 'none'; }
if(!TERMS || !TERMS.length){
  document.getElementById('terms').parentElement.style.display = 'none'; }
syncMode();
// The ramp key is built from costColor(), which is theme-dependent, so it has
// to be REBUILT on a theme change rather than baked once at load. A key left
// showing the dark-ground gradient on a light page runs the opposite way to the
// marks it is supposed to explain -- a legend that lies is worse than none.
function drawRampKey(){
  if(!VOL) return;
  const money = v => '$' + Math.round(v).toLocaleString('en-US');
  // A single-tier model gets a flat swatch and says so. A gradient captioned
  // "$1,807 -> $1,807" invites the reader to look for a variation the model
  // does not contain.
  const uni = VOL.uniform;
  document.getElementById('ramp').innerHTML =
    '<span>support + excavation cost, $/m</span>' +
    '<div class="bar" style="background:' + (uni ? costColor(128,1)
      : 'linear-gradient(90deg,' + costColor(1,1) + ',' + costColor(254,1) + ')')
      + '"></div>' +
    '<span>' + (uni ? money(VOL.cost_lo) + ' uniform &mdash; single rock tier'
                    : money(VOL.cost_lo) + ' &rarr; ' + money(VOL.cost_hi)) +
    (FAULT ? ' &middot; <b style="color:lch(52% 46 22)">fault</b>' : '') + '</span>' +
    '<span style="opacity:.65">' +
    (CLOUD ? CLOUD.n.toLocaleString('en-US') + ' cloud points &middot; ' : '') +
    'section at ' + VOL.downsample +
    '\u00d7 downsample</span>';
}
if(VOL){
  slider.value = Math.floor(VOL.dims[2] * 0.55);
  syncSlider();
  drawRampKey();
}

// Both routes into a theme change: the OS preference, and the viewer's own
// toggle stamping data-theme on <html>.
const onTheme = () => { drawRampKey(); draw(); };
if(window.matchMedia)
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement,
  {attributes:true, attributeFilter:['data-theme']});

describe(); draw();
</script>
